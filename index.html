<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qwertyuiop Games Launcher</title>
    <script
      data-goatcounter="https://launcher.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .search-box {
        margin: 1rem 0;
        padding: 0.5rem;
        width: 100%;
        max-width: 320px;
        font-size: 1rem;
      }

      .games {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        align-items: flex-start;
      }

      .game {
        flex: 1 1 250px;
        max-width: 320px;
        margin-bottom: 0;
      }

      .game img {
        display: block;
        width: 100%;
        max-width: 250px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <header><h1>Launcher</h1></header>
    <hr />

    <main>
      <input
        type="text"
        id="gameSearch"
        class="search-box"
        placeholder="Search games..."
        aria-label="Search games by name"
      />

      <span id="no-matches" hidden>No games match that search.</span>

      <div class="games" id="find-the-pwd">
        <div class="game">
          <div class="description">
            <a href="https://qwertyuiop-games.github.io/find-the-pwd/">
              <h2>Find the Password</h2>
            </a>
            <p>Find a secret password on a 1990 website!</p>
          </div>
          <img
            src="games/find-the-pwd/pictures/banner.png"
            alt="placeholder picture"
            width="500px"
          />
        </div>
      </div>
    </main>

    <script>
      const searchInput = document.getElementById("gameSearch");
      const games = document.querySelectorAll(".games .game");

      searchInput.addEventListener("input", () => {
        const query = searchInput.value.toLowerCase();
        let anyMatch = false;

        games.forEach((game) => {
          const gameName = game.querySelector("h2").textContent.toLowerCase();
          const matches = gameName.includes(query);
          game.style.display = matches ? "" : "none";
          if (matches) anyMatch = true;
        });

        document.getElementById("no-matches").hidden = anyMatch;
      });
    </script>
  </body>
</html>
